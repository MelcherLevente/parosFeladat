<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanulói nyilvántartó rendszer</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
</head>
<body>
    <form id="inputForm">
        <label>Írj be ide egy nevet: </label>
        <input type="text" name="nev" id="nevInput">
        <br>
        <label for="osztaly">Írd be az osztályt: </label>
        <input type="text" name="osztaly" id="osztalyInput">
        <br>
        <label for="atlag">Írd be az átlagot:</label>
        <input type="text" name="atlag" id="atlagInput">
        <br>
        <button type="submit" id="mentesBtn" onclick="ujTanuloMentes()">Mentés</button>
        <br>
        <label id="hiba"></label>
    </form>
    
    
    <table id="tablazat">
        <thead>
            <tr>
                <th>Név</th>
                <th>Osztály</th>
                <th>Átlag</th>
                <th>Módosítás</th>
                <th>Törlés</th>
            </tr>
        </thead>
        <tbody id="tablazatTorzs">
            
        </tbody>
    </table>
    
<script src="main.js"></script>
</body>
</html>
