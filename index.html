<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanulói nyilvántartó rendszer</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="search-box">
        <img src="img/png-clipart-magnifying-glass-magnification-magnifying-glass-glass-logo-thumbnail.png" class="search-icon" alt="">
        <input type="text" id="search" placeholder="keresés...." oninput="searchbar()">
    </div>
    
    
    <form id="inputForm">
        <div id="inputok">
            <label>Írj be ide egy nevet: </label>
            <input type="text" name="nev" id="nevInput">
            <br>
            <label for="osztaly">Írd be az osztályt: </label>
            <input type="text" name="osztaly" id="osztalyInput">
            <br>
            <label for="atlag">Írd be az átlagot:</label>
            <input type="text" name="atlag" id="atlagInput">
            <br>
            <button type="submit" id="mentesBtn">Mentés</button>
            <button type="button" id="rendezesAtlagBtn" onclick="rendezesAtlag()">Átlag szerint</button>
            <button type="button" id="rendezesNevBtn" onclick="rendezesNev()">Név szerint</button>
            <br>
            <label id="hiba"></label>
        </div>
    </form>
    
    <table id="tablazat">
        <thead>
            <tr>
                <th>Név</th>
                <th>Osztály</th>
                <th>Átlag</th>
                <th>Módosítás</th>
                <th>Törlés</th>
            </tr>
        </thead>
        <tbody id="tablazatTorzs">
            
        </tbody>
    </table>
    <p id="search-results"></p>

    <h1>Statisztikák</h1>

    <p id="letszam"></p>

    <div>
        <label for="osztaly">Melyik osztály átlagát mutassam?</label>
        <input type="text" name="osztaly" id="osztaly" >
        <button onclick="osztalyAtlag()">Mutasd</button><br>
    </div>
    
    
    <p id="osztalyAtlag"></p>

    <p id="legjobbTanulo"></p>

    <h1>Jegystatisztika</h1>
    <p id="jeles"></p>
    <p id="jo"></p>
    <p id="kozepes"></p>
    <p id="elegseges"></p>
    <p id="elegtelen"></p>

<script src="main.js"></script>
</body>
</html>
